name: Bug report
description: Report a problem with yt-dlp Quick UI.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not attach cookies, account data, private links, or logs that contain personal paths.
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: 1.0.0
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include steps to reproduce and the error text after removing personal paths.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

